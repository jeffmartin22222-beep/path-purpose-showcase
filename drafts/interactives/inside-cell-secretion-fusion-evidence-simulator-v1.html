<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside the Cell | Fusion Evidence Lab v1</title>
<style>
:root{font:16px system-ui,sans-serif;color:#e9f3ff;background:#0a1830}*{box-sizing:border-box}body{margin:0}.shell{height:100dvh;min-height:420px;display:flex;flex-direction:column;padding:clamp(10px,2vw,22px);gap:10px;max-width:1100px;margin:auto}header{display:flex;justify-content:space-between;gap:10px;align-items:center}h1{font-size:clamp(18px,2.4vw,26px);margin:0}p{margin:4px 0}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,1fr);gap:12px}.panel{background:#142747;border:1px solid #3a5679;border-radius:16px;padding:14px;min-height:0;overflow:auto}.scene{display:flex;flex-direction:column}.scene svg{width:100%;height:100%;min-height:150px}button{background:#45e0c2;color:#09253b;border:0;border-radius:10px;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #ffe283;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button[aria-pressed=true]{background:#ffe283}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:.88rem;color:#bfd4ec}fieldset{border:1px solid #577494;border-radius:10px;margin:10px 0}legend{font-weight:700}label{display:block;padding:5px}input{margin-right:8px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:6px;text-align:left;border-bottom:1px solid #486080}.ok{color:#8df4bc}.warn{color:#ffe283}#feedback{min-height:3em}@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:minmax(130px,1fr) minmax(180px,1.1fr)}.panel{padding:9px}.shell{gap:6px}.small{font-size:.78rem}button{padding:9px}h1{font-size:17px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="shell"><header><div><h1>Inside the Cell · Secretory Vesicle Lab</h1><p class="small">Model: soluble cargo at the plasma membrane · no materials needed</p></div><strong id="stage">1 / 4</strong></header>
<main><section class="panel scene" aria-label="Membrane and vesicle schematic"><svg viewBox="0 0 600 360" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">Vesicle approaches the plasma membrane</title><desc id="diagramDesc">An intracellular transport vesicle containing four soluble cargo molecules. The cell membrane separates the cytosol from the extracellular space. The visual changes with the experimental condition.</desc><rect x="0" y="0" width="600" height="170" fill="#183d58"/><rect x="0" y="190" width="600" height="170" fill="#263452"/><text x="20" y="32" fill="#c6f6ff">Outside cell</text><text x="20" y="340" fill="#c6f6ff">Cytosol</text><path d="M0 177 H600 M0 186 H600" stroke="#79c6e6" stroke-width="5"/><g id="vesicle"><circle cx="300" cy="260" r="53" fill="#375778" stroke="#67e0f2" stroke-width="8"/><g fill="#ffe283"><circle cx="280" cy="244" r="7"/><circle cx="316" cy="244" r="7"/><circle cx="282" cy="278" r="7"/><circle cx="317" cy="278" r="7"/></g></g><g id="released" style="display:none" fill="#ffe283"><circle cx="250" cy="100" r="7"/><circle cx="295" cy="82" r="7"/><circle cx="335" cy="117" r="7"/><circle cx="378" cy="69" r="7"/></g><g id="fusion" style="display:none"><path d="M244 177 Q265 210 300 212 Q335 210 356 177" fill="none" stroke="#67e0f2" stroke-width="7"/><path d="M246 186 Q267 224 300 225 Q333 224 354 186" fill="none" stroke="#67e0f2" stroke-width="5"/></g><text id="diagramLabel" x="300" y="316" text-anchor="middle" fill="white">Vesicle contains 4 cargo markers</text></svg><p class="small" id="alt">Schematic only; not to scale. Cargo markers represent soluble molecules, not individual measured proteins.</p></section>
<section class="panel"><div id="content" aria-live="polite"></div><div id="feedback" role="status" aria-live="polite"></div></section></main>
<div class="bottom"><button id="back">Back</button><span class="small" id="progress">Prediction</span><button id="next">Next</button></div></div>
<script>
(()=>{'use strict';
const KEY='pp-secretion-fusion-evidence-v1',el=id=>document.getElementById(id);
let state={step:0,prediction:null,results:{},answer:null,reason:'',completed:false};
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&raw.version===1){state={...state,...raw};}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,version:1}));}catch{}}
const conditions={enabled:{name:'Fusion enabled',docked:true,fused:true,released:4},blocked:{name:'Fusion blocked',docked:true,fused:false,released:0}};
function view(condition){const x=conditions[condition];el('vesicle').style.display=x&&x.fused?'none':'block';el('released').style.display=x&&x.fused?'block':'none';el('fusion').style.display=x&&x.fused?'block':'none';el('diagramLabel').textContent=x?(x.fused?'Cargo released outside; membrane continuity schematic':'Docked vesicle retains all 4 cargo markers'):'Vesicle contains 4 cargo markers';el('alt').textContent=x?(x.fused?'Fusion joins the vesicle and plasma membranes; soluble cargo can enter extracellular space. Diagram is schematic, not molecular-scale geometry.':'Docking positions the vesicle at the plasma membrane. Without fusion, soluble cargo remains enclosed.'):'Schematic only; not to scale. Cargo markers represent soluble molecules, not individual measured proteins.';}
function render(){el('stage').textContent=(state.step+1)+' / 4';el('progress').textContent=['Predict','Experiment','Explain','Reflect'][state.step];el('back').disabled=state.step===0;el('feedback').textContent='';let s='';
if(state.step===0){view(null);s='<h2>Predict before testing</h2><p>A vesicle docks at the cell membrane. If fusion is blocked, what happens to its soluble cargo?</p><fieldset><legend>Choose one prediction</legend>'+[['released','Cargo is released because docking is enough'],['retained','Cargo stays inside because membranes have not fused'],['destroyed','Cargo is destroyed by docking']].map(([v,t])=>'<label><input type="radio" name="prediction" value="'+v+'" '+(state.prediction===v?'checked ':'')+(state.prediction?'disabled':'')+'>'+t+'</label>').join('')+'</fieldset><p class="small">Once selected, your original prediction is saved and cannot be changed.</p>';}
if(state.step===1){s='<h2>Test membrane fusion</h2><p>Run both conditions. Only the ability to fuse changes. Docking occurs in both.</p><div class="controls"><button id="runEnabled">Run fusion enabled</button><button id="runBlocked">Run fusion blocked</button></div><table><caption>Recorded observations</caption><thead><tr><th>Condition</th><th>Docked</th><th>Fused</th><th>Cargo outside</th></tr></thead><tbody>'+Object.entries(conditions).map(([k,v])=>'<tr><td>'+v.name+'</td><td>'+(state.results[k]?'Yes':'—')+'</td><td>'+(state.results[k]?(v.fused?'Yes':'No'):'—')+'</td><td>'+(state.results[k]?v.released+' of 4':'—')+'</td></tr>').join('')+'</tbody></table><p class="small">This is a controlled conceptual model, not an empirical measurement. Both conditions begin with four cargo markers.</p>';}
if(state.step===2){view(state.results.blocked?'blocked':null);s='<h2>Explain the evidence</h2><p>Both vesicles dock. Why does only one release soluble cargo?</p><fieldset><legend>Choose the strongest explanation</legend>'+[['a','Docking alone opens the vesicle'],['b','Membrane fusion creates continuity so soluble cargo can exit'],['c','The Golgi directly pushes cargo through the plasma membrane']].map(([v,t])=>'<label><input type="radio" name="answer" value="'+v+'" '+(state.answer===v?'checked':'')+'>'+t+'</label>').join('')+'</fieldset><p>Compare the two results in your explanation: <label for="reason">My evidence</label></p><textarea id="reason" rows="3" style="width:100%;font:inherit" placeholder="When fusion was enabled..., but when it was blocked..."></textarea><p class="small">Use both conditions and describe what changed.</p>';}
if(state.step===3){view('enabled');s='<h2>Revisit your prediction</h2><p>Your original prediction: <strong>'+({released:'Docking alone releases cargo',retained:'Cargo remains enclosed without fusion',destroyed:'Docking destroys cargo'}[state.prediction]||'Not recorded')+'</strong></p><p>Evidence: fusion enabled released 4 of 4 markers; fusion blocked released 0 of 4, although both docked.</p><p><strong>What this model shows:</strong> docking and membrane fusion are different events. Membrane fusion allows soluble vesicle cargo to be secreted by exocytosis.</p><p class="ok">Investigation complete. Your response remains saved in this browser.</p>';}
el('content').innerHTML=s;
if(state.step===0&&!state.prediction)document.querySelectorAll('[name=prediction]').forEach(r=>r.addEventListener('change',()=>{if(state.prediction)return;state.prediction=r.value;save();render()}));
if(state.step===1){for(const k of Object.keys(conditions)){el(k==='enabled'?'runEnabled':'runBlocked').onclick=()=>{state.results[k]=true;save();view(k);render();view(k);el('feedback').textContent=k==='enabled'?'Fusion: four markers outside.':'No fusion: all four markers remain enclosed.';};}}
if(state.step===2){el('reason').value=state.reason;el('reason').addEventListener('input',e=>{state.reason=e.target.value;save()});document.querySelectorAll('[name=answer]').forEach(r=>r.addEventListener('change',()=>{state.answer=r.value;save();el('feedback').textContent=r.value==='b'?'Correct: membrane continuity permits secretion.':r.value==='a'?'Docking brings membranes close, but does not create a release opening.':'The Golgi sorts and modifies cargo; exocytosis occurs at the plasma membrane.';}));}
el('next').textContent=state.step===3?'Finished':'Next';el('next').disabled=state.step===3;
}
el('next').onclick=()=>{if(state.step===0&&!state.prediction){el('feedback').textContent='Choose and lock your prediction first.';return;}if(state.step===1&&(!state.results.enabled||!state.results.blocked)){el('feedback').textContent='Run both conditions to compare evidence.';return;}if(state.step===2){if(state.answer!=='b'){el('feedback').textContent='Reconsider the checkpoint: docking is not fusion.';return;}if(state.reason.trim().length<35||!/fusion|fused/i.test(state.reason)||!/block|without|not|no /i.test(state.reason)){el('feedback').textContent='Explain both conditions and mention the fusion difference using evidence.';return;}}if(state.step<3){state.step++;if(state.step===3)state.completed=true;save();render();}};
el('back').onclick=()=>{if(state.step>0){state.step--;save();render();}};render();
window.addEventListener('message',e=>{if(e.data&&e.data.type==='PP_SECRETION_GET_STATE'&&e.source){e.source.postMessage({type:'PP_SECRETION_STATE_V1',payload:{...state,version:1}},e.origin||'*');}});
})();
</script></html>
