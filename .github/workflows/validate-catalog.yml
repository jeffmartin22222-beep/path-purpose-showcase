name: Validate curriculum catalog
on:
  push:
    branches: [main, feature/qa-gated-publishing]
  pull_request:
  workflow_dispatch:
concurrency:
  group: curriculum-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check import tool syntax
        run: node --check scripts/import-approved-package.mjs
      - name: Run QA gate negative and positive tests
        run: node --test tests/*.test.mjs
      - name: Verify approved catalog and evidence integrity
        run: node scripts/validate-catalog.mjs
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise mobile and tablet layouts in real browser engine
        run: node tests/browser-smoke.mjs
      - name: Verify nonempty catalog and reject unsafe lesson dependencies
        run: node tests/browser-fixture.mjs
